name: offline-regression
on: [workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[evaluation,test]'
      - run: python -B -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      # Native acceptance is explicit/opt-in on a qualified Linux/Codex host.
      # CI never logs into Codex, calls paid models, or submits a Slurm job.
