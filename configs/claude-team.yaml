base: common.yaml
profile: team
output_prefix: claude-team
harness:
  name: claude_code
  executable: claude
backend:
  auth: api
  protocol: anthropic
  env_file: ../.env
  base_url_env: CLAUDE_API_BASE_URL
  api_key_env: CLAUDE_API_KEY
model:
  name: replace-with-your-model-id
  reasoning_effort: high
  max_agents: 3
  researcher_model: replace-with-your-worker-model-id
  researcher_effort: medium
