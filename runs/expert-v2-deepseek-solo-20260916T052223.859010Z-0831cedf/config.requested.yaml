version: 1
account:
  auth_home: /root/.codex-experiment
network:
  env_file: ../.env.network
  require_proxy: true
  timeout_seconds: 10
resources:
  search_cpu_hours: 512
  wall_hours: 24
  evaluation_cpu_hours: 64
inputs:
  task: ../tasks/usc_ii_expert_v2
  accepted: ../local/accepted.json
  evaluation_base: ../local/evaluation_base.json
output:
  root: ../runs
  prefix: expert-v2-deepseek-solo
transcript:
  enabled: true
deployment:
  search_root: /public3/home/sca2070/WORK/Caifeixue/AgenticRL_research_runs/kinetic-agents
  container_image: /public3/home/sca2070/WORK/Caifeixue/AgenticRL_research_runs/solo-team-max-20260914-v1/runtime/python.sif
  evaluation_python: /public3/home/sca2070/WORK/Caifeixue/AgenticRL_research_runs/pilot-env-20260912-b/venv/bin/python
profile: solo
model:
  name: deepseek-flash
  reasoning_effort: max
  max_agents: 1
harness:
  name: codex
  executable: codex
backend:
  auth: api
  protocol: responses
  env_file: ../../.env.deepseek-drg-ablation
  base_url_env: DEEPSEEK_BASE_URL
  api_key_env: DEEPSEEK_API_KEY
